# An edit made offline reaches the server, and does not become a second entry.
#
# The sync design turns on the id being generated by the device, so a retry after an ambiguous
# timeout updates the row it already created rather than creating another. That is asserted in
# tests against a fake server; this asserts it against the real one.
appId: com.vivaan.gutsignal
---
- launchApp
- tapOn: 'Timeline'

# Start from a synced entry, so what is being tested is the edit rather than the creation.
- assertVisible: 'offline test meal'
- tapOn: 'offline test meal'

# --- Go offline, then edit -----------------------------------------------
- extendedWaitUntil:
    visible: 'Save'
    timeout: 60000
    # ^ pause for airplane mode on

- tapOn: 'What was in it?'
- eraseText
- inputText: 'edited while offline'
- tapOn: 'Save'

- assertVisible: 'edited while offline'
- assertNotVisible: 'offline test meal'

# --- Reconnect and let it settle -----------------------------------------
- extendedWaitUntil:
    visible: 'Timeline'
    timeout: 60000
    # ^ pause for airplane mode off

- assertVisible: 'edited while offline'
# --- The half Maestro cannot see -----------------------------------------
# In Supabase:
#
#   select id, title, updated_at from meal_logs order by updated_at desc limit 5;
#
# Expect ONE row, its title now 'edited while offline', and its id unchanged from before the edit.
# A second row means the edit was sent as an insert; an unchanged title means the outbox dropped
# it, which §15 forbids.
